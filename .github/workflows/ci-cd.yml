# Fluid AI Kubernetes CI/CD challenge
name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: pvrajucloudops/fluid-ai-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            ./app

      # 4. Push Docker image
      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      # 5. Deploy to EC2 Kubernetes
      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/fluid-ai-devops-challenge

            echo "Pulling latest Kubernetes configuration..."
            git pull origin main

            echo "Applying namespace..."
            kubectl apply -f k8s/namespace.yaml

            echo "Applying PostgreSQL..."
            kubectl apply -f k8s/postgres.yaml

            echo "Applying backend..."
            kubectl apply -f k8s/backend.yaml

            echo "Updating backend image..."
            kubectl -n fluid-demo set image deployment/backend \
              backend=pvrajucloudops/fluid-ai-backend:${{ github.sha }}

            echo "Waiting for rollout..."
            kubectl -n fluid-demo rollout status deployment/backend

            echo "Deployment successful!"
            kubectl -n fluid-ai get pods
            kubectl -n fluid-ai get svc
